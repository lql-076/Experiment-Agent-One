<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Agent 主控台图标：深色圆角底 + 渐变决策环（和常驻时钟同一套）+ 环上的秒点 + 中间的核心 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1846"/>
      <stop offset="1" stop-color="#07071a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#8f74ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8f74ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b0ff"/>
      <stop offset=".5" stop-color="#5fb8ff"/>
      <stop offset="1" stop-color="#3fe8d6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#ff6fae"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="18"/>
  <!-- 决策环：从 12 点顺时针走到 10 点左右 -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="370 440" transform="rotate(-90 128 128)" filter="url(#soft)" opacity=".55"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="370 440" transform="rotate(-90 128 128)"/>
  <!-- 环上的秒点 -->
  <circle cx="86.3" cy="71.7" r="15" fill="#ff6fae" filter="url(#soft)" opacity=".8"/>
  <circle cx="86.3" cy="71.7" r="11" fill="#ffd4e6"/>
  <!-- 核心 -->
  <circle cx="128" cy="128" r="26" fill="url(#core)" filter="url(#soft)" opacity=".6"/>
  <circle cx="128" cy="128" r="22" fill="url(#core)"/>
</svg>
